plugins {
    id 'com.android.application'
}

def signingPath = System.getenv("WELLTECH_KEYSTORE_PATH")
def signingStorePassword = System.getenv("WELLTECH_KEYSTORE_PASSWORD")
def signingAlias = System.getenv("WELLTECH_KEY_ALIAS")
def signingKeyPassword = System.getenv("WELLTECH_KEY_PASSWORD")
def hasReleaseSigning = signingPath && signingStorePassword && signingAlias && signingKeyPassword

android {
    namespace 'com.welltech.mobile'
    compileSdk 36

    defaultConfig {
        applicationId "com.welltech.mobile"
        minSdk 26
        targetSdk 36
        versionCode 8
        versionName "0.3.1"
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(signingPath)
                storePassword signingStorePassword
                keyAlias signingAlias
                keyPassword signingKeyPassword
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-alpha"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
