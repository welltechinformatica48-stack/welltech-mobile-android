name: Build Welltech Mobile Agent APK

on:
  push:
    branches: [ "main", "dev/agent", "feature/agent-0.3-ui-transport" ]
  pull_request:
    branches: [ "main", "dev/agent" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          if [ "${GITHUB_REF_NAME}" = "feature/agent-0.3-ui-transport" ]; then
            OUT="Welltech-Mobile-Agent-0.3-ui-transport-dev.apk"
          else
            OUT="Welltech-Mobile-Agent-0.2.2-state-sync.apk"
          fi
          cp app/build/outputs/apk/debug/app-debug.apk "output/${OUT}"
          echo "ARTIFACT_NAME=${OUT%.apk}" >> "$GITHUB_ENV"
          echo "APK_PATH=output/${OUT}" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
